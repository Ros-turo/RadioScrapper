[project]
name = "radioscraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ros", email = "rostislavbondar3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
radioscraper = "radioscraper:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.mypy]
strict = true
